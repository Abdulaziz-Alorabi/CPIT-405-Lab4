<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great Auto Parts - Order Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Lab 4</h1>

<div class="container">
  <h2 class="form-title">Great Auto Parts - Order Form</h2>

  <form>
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName"
           placeholder="Enter your first name">

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName"
           placeholder="Enter your last name">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
           placeholder="Enter your email address">

    <label for="phone">Phone number:</label>
    <input type="tel" id="phone" name="phone"
           placeholder="Enter your phone number">

    <label for="make">Make:</label>
    <input type="text" id="make" name="make" placeholder="Make">

    <label for="model">Model:</label>
    <input type="text" id="model" name="model" placeholder="Model">

    <label for="year">Year:</label>
    <input type="number" id="year" name="year" placeholder="Year">

    <label for="date">Date:</label>
    <input type="date" id="date" name="date">

    <label for="part">Spare Part:</label>
    <input type="text" id="part" name="part"
           placeholder="Enter the spare part you need">

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity"
           placeholder="Enter the quantity of the spare part you need">

    <label for="comment">Comment:</label>
    <textarea id="comment" name="comment"
              placeholder="Enter your comment"></textarea>

    <button type="submit">Submit</button>
  </form>
</div>

</body>
</html>
